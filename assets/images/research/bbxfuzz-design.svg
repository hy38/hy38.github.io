<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">bbxfuzz source-aware stall-breaking loop</title>
  <desc id="desc">A diagram showing AFL++ running a fast local grammar mutation loop, then escalating coverage stalls to Codex through a source-backed review task.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f3a4a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #d8dee8; stroke-width: 2; }
      .box { rx: 8; fill: #ffffff; stroke-width: 2; }
      .blue { stroke: #2563eb; }
      .green { stroke: #15803d; }
      .amber { stroke: #b45309; }
      .violet { stroke: #7c3aed; }
      .red { stroke: #b91c1c; }
      .text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #111827; }
      .small { font-size: 18px; }
      .mid { font-size: 22px; font-weight: 650; }
      .title { font-size: 30px; font-weight: 750; }
      .muted { fill: #4b5563; font-size: 16px; }
      .line { stroke: #2f3a4a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="660"/>
  <text class="text title" x="56" y="56">bbxfuzz: keep the fast loop local, escalate only with source context</text>
  <text class="text muted" x="56" y="86">The LLM is not the fuzzer. It is a stall-breaker that writes new seeds and grammar updates for AFL++ to test.</text>

  <rect class="lane" x="44" y="122" width="1032" height="190" rx="10"/>
  <text class="text mid" x="70" y="158">Tier 1: local mutation loop</text>
  <text class="text muted" x="70" y="184">Runs every campaign cycle with no LLM call</text>

  <rect class="box blue" x="72" y="210" width="210" height="70"/>
  <text class="text mid" x="102" y="242">Grammar rules</text>
  <text class="text muted" x="102" y="266">syntax-aware seeds</text>

  <rect class="box green" x="340" y="210" width="210" height="70"/>
  <text class="text mid" x="377" y="242">Corpus mutation</text>
  <text class="text muted" x="377" y="266">reuse close inputs</text>

  <rect class="box amber" x="608" y="210" width="210" height="70"/>
  <text class="text mid" x="647" y="242">Strategies</text>
  <text class="text muted" x="647" y="266">bounds and patterns</text>

  <rect class="box blue" x="876" y="210" width="160" height="70"/>
  <text class="text mid" x="919" y="242">AFL++</text>
  <text class="text muted" x="906" y="266">coverage oracle</text>

  <path class="line" d="M282 245 H340"/>
  <path class="line" d="M550 245 H608"/>
  <path class="line" d="M818 245 H876"/>

  <rect class="lane" x="44" y="350" width="1032" height="245" rx="10"/>
  <text class="text mid" x="70" y="386">Tier 2: source-aware stall breaking</text>
  <text class="text muted" x="70" y="412">Triggered after low edge growth across the configured stall window</text>

  <rect class="box red" x="72" y="438" width="210" height="78"/>
  <text class="text mid" x="110" y="470">Coverage stall</text>
  <text class="text muted" x="103" y="494">stuck branches found</text>

  <rect class="box violet" x="312" y="438" width="180" height="78"/>
  <text class="text mid" x="347" y="470">Solver</text>
  <text class="text muted" x="337" y="494">patch simple paths</text>

  <rect class="box blue" x="532" y="438" width="190" height="78"/>
  <text class="text mid" x="558" y="470">Prompt with C</text>
  <text class="text muted" x="557" y="494">branch, solver logs</text>

  <rect class="box amber" x="762" y="438" width="160" height="78"/>
  <text class="text mid" x="794" y="470">Codex</text>
  <text class="text muted" x="785" y="494">review task</text>

  <rect class="box green" x="950" y="438" width="92" height="78"/>
  <text class="text mid" x="970" y="470">Load</text>
  <text class="text muted" x="970" y="494">seeds</text>

  <path class="line" d="M282 477 H312"/>
  <path class="line" d="M492 477 H532"/>
  <path class="line" d="M722 477 H762"/>
  <path class="line" d="M922 477 H950"/>
  <path class="dash" d="M1002 438 C1002 360 956 326 956 280"/>

  <text class="text muted" x="72" y="560">If the local solver generates useful seeds, Codex can be skipped. Otherwise, solver diagnostics are forwarded with source context.</text>
  <text class="text muted" x="72" y="625">Design insight: AFL++ supplies speed and truth; Codex only helps when source context makes seed generation precise.</text>
</svg>
